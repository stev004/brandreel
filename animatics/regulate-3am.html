<title>3:04 AM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400&display=swap">
<!--
  brandreel animatic rev2 - regulate - "3:04 AM" 15.5s
  PORTING CONTRACT: 1:1 into Remotion. 1080x1920, ms from t=0, total 15500ms.
  If the port looks worse than this file, it goes back.

  LINEAGE (rev2 = scaled transcription of the approved mock)
  Source: hivemind marketing/motion-drafts.html, concept 3 ("3:04 AM", v4 per
  Steven 07-12, player durations c3:[5,7,2.5]). Steven on rev1: "based on the
  mock i liked but it isn't 1:1 - motion not as smooth, text doesn't match
  the brand, timing off, we need continuity". rev1 had transcribed the
  Remotion port's numbers instead of the mock's. rev2 transcribes the mock.

  SCALE: the mock stage is a 300x640 phone. Sizes and horizontal offsets
  scale by Sx = 1080/300 = 3.6. Vertical px offsets scale by Sy = 1920/640 =
  3.0. Percent positions carry unchanged. Every value below is
  mock-value x scale, rounded; the mock value is shown in [brackets].

  DEVIATIONS FROM THE MOCK (each forced by a Brand Book law, nothing else):
  1. Ground #0a1812 everywhere [mock: scene 0 #050b08, phone #0c1912] -
     "emerald is the ground".
  2. The falling dot is teal #4FD1C5 [mock: sage #a9c99e, not a token] -
     "teal is a supplement: one live thing per surface". The track keeps
     the mock's gradient shape in the real sage token #8BA89F. TWEAK option
     if the mock's calmer dot is wanted: dot = #8BA89F, glow rgba(139,168,159,.8).
  3. Dim text uses theme tokens: ink-dim -> #8BA89F (theme mutedSage)
     [mock #9db3a5]; mono-dim -> #8F9E8B at 72% [mock #64806f].
  4. Serif is Playfair Display 400 [mock: "Bodoni 72" on Steven's Mac,
     Playfair listed as its own fallback]. Mono is JetBrains Mono [mock: SF
     Mono; the site's declared stack lists JetBrains Mono, and it is on
     Google Fonts so the port can load it deterministically].
  5. Wordmark dot #FFFFFF [mock: ink #efe9dc] - "the dot is always white".
  6. Close holds 3.5s [mock 2.5s] so the video clears the 15s lint floor;
     nothing inside the close changes.

  CORE MECHANIC: Three intrusive thoughts phase in around the clock, then a
  single long exhale carries a dot down a column while the same thoughts, in
  the same places, blur out. The exhale is the only thing that moves them.

  SCENE TABLE (ms) - mock player c3 [5, 7, 2.5]s
  S1 MOMENT  0-5000     scene opacity 1 · eyebrow rises 150 · "awake again."
                        rises 500 (rise = 700ms cubic-bezier(.2,.7,.2,1),
                        opacity 0->1, translateY 50->0 [14px]) · thoughts fade
                        to .75 over 1200ms `ease` at 1600 / 2600 / 3600
  X-FADE     5000-5450  S1 opacity 1->0 and S2 0->1 over 450ms, linear
                        [.sc.on transition .45s] - a crossfade, never a cut
  S2 EXHALE  5000-12000 dot top->bottom of the column over 7000ms,
                        cubic-bezier(.45,.05,.55,.95) [colout 7s] · "Exhale"
                        and "Let it all the way out" present from 5000 ·
                        thoughts dissolve over 4600ms `ease` at 5000 / 5900 /
                        6800 (opacity .75->0, blur 0->18px [5px],
                        translateY 0->-50px [14px])
  X-FADE     12000-12450
  S3 CLOSE   12000-15500 wordmark rises 12150 · line rises 12500 · hold

  GEOMETRY (px on 1080x1920; [mock px])
  Scene box: flex column, centred, padding 102/94 [34/26].
  S1  eyebrow "3:04 AM": mono 58 [16], tracking .4em, mono-dim, uppercase.
      "awake again.": serif italic 400, 94 [26], ink, margin-top 54 [18].
      thoughts: sans 47 [13], ink-dim, nowrap, max-width 62%:
        t1 "the email you didn't send"  top 19%  left 9%
        t2 "tomorrow. tomorrow."        top 30%  left 20%
        t3 "why did you say that"       bottom 25% left 12%
      Same coordinates in S2. They must not move across the crossfade.
  S2  column box: right 158 [44], top 288 [96], bottom 288 [96], width 144 [40].
      track: left 50%, top 54 [18], bottom 54 [18], width 7 [2], gradient
      sage -> sage 25%. ticks: 50x3 [14x1], cream 35%, at 54 from top and
      bottom of the box. dot: 58 [16], centre travels box top+54 -> box
      bottom-54, glow 0 0 79px [22]. labels "IN  4" / "OUT  8": mono 36 [10],
      tracking .22em, mono-dim, centred on the box, top -12 / bottom -12 [-4].
      phase block: left 108 [30], top 44%, left-aligned: "Exhale" serif 400
      137 [38] ink; "Let it all the way out" mono 36 [10] .22em mono-dim,
      margin-top 24 [8].
  S3  centred stack: wordmark serif 400 130 [36] ink, dot #FFFFFF;
      "For the nights your mind won't stop." sans 50 [14] ink-dim,
      margin-top 42 [14], max-width 24ch.

  SAFE ZONES: top 150 / bottom 320 / right 120 / left 60 - column right edge
  x922, t3 bottom ~y1487, all clear.

  COPY LIST (the contract - every on-screen string, verbatim from the mock):
    3:04 AM · awake again. · the email you didn't send · tomorrow. tomorrow. ·
    why did you say that · IN  4 · OUT  8 · Exhale · Let it all the way out ·
    regulate. · For the nights your mind won't stop.

  VO SCRIPT (optional; Steven's own voice preferred)
    [0.4s]  Three-oh-four. Awake again.
    [5.4s]  Breathe out. All the way out.
    [12.3s] Regulate. For the nights your mind won't stop.

  CAPTION: 3:04 AM. Awake again. One long exhale for the nights your mind
  won't stop. Not meditation. Regulation.
  HASHTAGS: #regulate #cantsleep #nervoussystem #3am
-->
<style>
  :root{
    --bg:#0a1812; --ink:#F2F0E9; --ink-dim:#8BA89F; --mono-dim:rgba(143,158,139,.72);
    --teal:#4FD1C5; --sage:#8BA89F; --dot:#FFFFFF;
    --serif:"Playfair Display", "Bodoni 72", Didot, Georgia, serif;
    --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    --mono:"JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
    --house:cubic-bezier(.2,.7,.2,1);
    --breath:cubic-bezier(.45,.05,.55,.95);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#05100b;color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px}
  .frame{position:relative;width:1080px;height:1920px;transform-origin:top center;background:var(--bg);overflow:hidden;border-radius:158px;box-shadow:0 30px 80px rgba(0,0,0,.6);flex:none}
  .film{position:absolute;inset:0}

  /* scenes: the mock's .sc.on opacity transition .45s -> crossfades */
  .sc{position:absolute;inset:0;background:var(--bg);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:102px 94px}
  .on .s1{animation:s1 5450ms linear 0ms forwards}
  .on .s2{animation:s2 7450ms linear 5000ms forwards}
  .on .s3{animation:s3 450ms linear 12000ms forwards}
  @keyframes s1{0%{opacity:1}91.74%{opacity:1}100%{opacity:0}}          /* 5000/5450 */
  @keyframes s2{0%{opacity:0}6.04%{opacity:1}93.96%{opacity:1}100%{opacity:0}} /* 450/7450, 7000/7450 */
  @keyframes s3{to{opacity:1}}

  /* shared pieces, x3.6 */
  .m{font-family:var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--mono-dim)}
  .serif{font-family:var(--serif);font-weight:400;color:var(--ink)}
  .rise{opacity:0;transform:translateY(50px)}
  .on .rise{animation:rise 700ms var(--house) forwards}
  .on .d1{animation-delay:150ms} .on .d2{animation-delay:500ms}
  .on .s3 .d1{animation-delay:12150ms} .on .s3 .d2{animation-delay:12500ms}
  @keyframes rise{to{opacity:1;transform:none}}

  /* S1 */
  .eyebrow{font-size:58px;letter-spacing:.4em;white-space:nowrap}
  .awake{font-size:94px;font-style:italic;line-height:1;margin-top:54px;white-space:nowrap}

  /* thoughts - same coordinates in S1 and S2 */
  .th{position:absolute;font-family:var(--sans);font-size:47px;line-height:1;color:var(--ink-dim);white-space:nowrap;max-width:62%;text-align:left}
  .t1{top:19%;left:9%} .t2{top:30%;left:20%} .t3{bottom:25%;left:12%}
  .s1 .th{opacity:0}
  .on .s1 .t1{animation:thoughtin 1200ms ease 1600ms forwards}
  .on .s1 .t2{animation:thoughtin 1200ms ease 2600ms forwards}
  .on .s1 .t3{animation:thoughtin 1200ms ease 3600ms forwards}
  @keyframes thoughtin{to{opacity:.75}}
  .s2 .th{opacity:.75}
  .on .s2 .t1{animation:dissolve 4600ms ease 5000ms forwards}
  .on .s2 .t2{animation:dissolve 4600ms ease 5900ms forwards}
  .on .s2 .t3{animation:dissolve 4600ms ease 6800ms forwards}
  @keyframes dissolve{0%{opacity:.75;filter:blur(0)}100%{opacity:0;filter:blur(18px);transform:translateY(-50px)}}

  /* S2 breath column, x3.6 / x3.0 */
  .colwrap{position:absolute;right:158px;top:288px;bottom:288px;width:144px}
  .coltrack{position:absolute;left:50%;top:54px;bottom:54px;width:7px;transform:translateX(-50%);background:linear-gradient(var(--sage),rgba(139,168,159,.25));border-radius:7px}
  .coltick{position:absolute;left:50%;transform:translateX(-50%);width:50px;height:3px;background:rgba(242,240,233,.35)}
  .coldot{position:absolute;left:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--teal);box-shadow:0 0 79px rgba(79,209,197,.8);top:54px}
  .on .coldot{animation:colout 7000ms var(--breath) 5000ms forwards}
  @keyframes colout{from{top:54px}to{top:calc(100% - 54px)}}
  .collab{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:36px;letter-spacing:.22em;color:var(--mono-dim);white-space:pre;line-height:1}
  .phaseblock{position:absolute;left:108px;top:44%;text-align:left}
  .phaseblock .pw{font-size:137px;line-height:1}
  .phaseblock .ps{font-family:var(--mono);font-size:36px;letter-spacing:.22em;color:var(--mono-dim);margin-top:24px;white-space:nowrap}

  /* S3 */
  .wordmark{font-family:var(--serif);font-weight:400;font-size:130px;line-height:1;color:var(--ink);white-space:nowrap}
  .wordmark .dot{color:var(--dot)}
  .closeline{color:var(--ink-dim);font-size:50px;line-height:1.35;margin-top:42px;max-width:24ch}

  /* review chrome */
  .bar{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:#8F9E8B}
  .bar .track2{width:320px;height:3px;background:#1a2a22;position:relative}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--teal);width:0}
  button{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:none;border:1px solid rgba(242,240,233,.25);border-radius:999px;padding:8px 18px;cursor:pointer}
  button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.on *{animation-duration:1ms!important;animation-delay:0ms!important}}
</style>

<div class="frame" id="frame">
  <div class="film on" id="film">
    <div class="sc s1">
      <div class="m eyebrow rise d1">3:04 AM</div>
      <div class="serif awake rise d2">awake again.</div>
      <div class="th t1">the email you didn't send</div>
      <div class="th t2">tomorrow. tomorrow.</div>
      <div class="th t3">why did you say that</div>
    </div>

    <div class="sc s2">
      <div class="colwrap">
        <div class="collab" style="top:-12px">IN  4</div>
        <div class="coltrack"></div>
        <div class="coltick" style="top:54px"></div>
        <div class="coltick" style="bottom:54px"></div>
        <div class="coldot"></div>
        <div class="collab" style="bottom:-12px">OUT  8</div>
      </div>
      <div class="phaseblock">
        <div class="serif pw">Exhale</div>
        <div class="ps">Let it all the way out</div>
      </div>
      <div class="th t1">the email you didn't send</div>
      <div class="th t2">tomorrow. tomorrow.</div>
      <div class="th t3">why did you say that</div>
    </div>

    <div class="sc s3">
      <div class="wordmark rise d1">regulate<span class="dot">.</span></div>
      <div class="closeline rise d2">For the nights your mind won't stop.</div>
    </div>
  </div>
</div>

<div class="bar">
  <span id="tc">0.00s</span>
  <div class="track2"><div class="fill" id="fill"></div></div>
  <span>15.50s</span>
  <button id="replay" type="button">Replay</button>
</div>

<script>
(function(){
  var TOTAL = 15500;
  var frame = document.getElementById('frame');
  var fill = document.getElementById('fill');
  var tc = document.getElementById('tc');
  var start = performance.now();

  function fit(){
    var scale = Math.min((window.innerHeight - 90) / 1920, (window.innerWidth - 36) / 1080);
    frame.style.transform = 'scale(' + scale + ')';
    frame.style.marginBottom = (-(1920 - 1920 * scale)) + 'px';
  }
  fit(); window.addEventListener('resize', fit);

  function tick(){
    var t = Math.min(TOTAL, performance.now() - start);
    tc.textContent = (t / 1000).toFixed(2) + 's';
    fill.style.width = (t / TOTAL * 100) + '%';
    if (t < TOTAL) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  document.getElementById('replay').addEventListener('click', function(){
    var film = document.getElementById('film');
    var clone = film.cloneNode(true);
    film.parentNode.replaceChild(clone, film);
    start = performance.now();
    requestAnimationFrame(tick);
  });
})();
</script>
