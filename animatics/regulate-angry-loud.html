<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loud Reel</title>
<!--
  brandreel animatic v1 - regulate - "Loud." social reel (Angry -> Chaos Release), ~16s (T.dur), 1080x1920 @ 60
  Direction 2 of the three Angry directions (marketing/reels-2026-09/ANGRY_AND_TRAILER_DIRECTIONS.md),
  built from regulate-612-angry (same Chaos Release physics, colours, ball sizes, charge binding).
  - Story: 6:12 PM, still replaying it. One line, "forget it", lands four times on heartbeats, each
    replay 1.4x larger, brighter and harder than the last, stacking down the frame; the heartbeat
    (colon + score) climbs 100 -> 124 bpm and the gaps shrink (two beats, two beats, one). On the
    fourth the clock blows out and the charge numeral is born in its place, already at 100: the
    replays made it. The colon's lower dot, the white point, lifts to sit above it and carries the
    heartbeat. "Shake it out instead." + the app's line SHAKE YOUR DEVICE TO DRAIN THE CHARGE; the
    device's edge draws in around the stack. Then the device shakes (edge, stack, numeral and balls
    jolt at the game's 110ms cooldown) while the headline and the point stay dead still: the viewer
    is shaking their phone. Each of the first four bouts shatters one replay, top-down, into the
    game's red balls (the loudest replay makes the most); two more bouts drain the rest, 100 -> 0,
    the swarm thinning with the charge. Last ball gone: stillness, silence. The point falls and
    becomes the full stop of "regulate." Then "Somewhere to put it." and the CTA.
  - The game is the app's (components/ShakeGame.tsx, app main): balls 10-18pt at .85 in #C06C4D /
    #B54B32; no gravity, wall bounces (restitution .92-.98 + tangential jitter), equal-mass
    collisions (.9), damping .999, speed floor bound to the charge; each shake kicks every ball in
    its own random direction at m x 260pt/s x .6-1.4, capped 1200pt/s; visible balls =
    round(charge% x 80) by index, exactly as the game; serif numeral / PERCENT CHARGED as the app.
    The charge drains in steps, one per 60ms sensor update, only while shaking; milestone haptics
    at 75/50/25 are thumps. The sim runs in regulate-angry-loud.timing.js; the score reads the same
    run, so every rattle is a real collision in the picture.
  DEVIATIONS (honest):
  - Time: the drain is ~4.5s of shaking in six bouts; the game takes ~12-20s of real effort.
    Compressed ~3x. Early bouts drain less so the replays can break before the swarm thins.
  - The swarm is born from the letters, so it peaks at 58 balls (the game's 80-ball binding at the
    charge when the last replay breaks) instead of starting at 80. From then on the binding is the
    game's, ball for ball.
  - SHAKE YOUR DEVICE TO DRAIN THE CHARGE is the game's accessibilityLabel (ShakeGame.tsx:607, what
    VoiceOver reads), shown here as the on-screen instruction. The game's on-screen cue KEEP SHAKING,
    the ANGER - CHAOS RELEASE eyebrow, the NN% readout and the progress track are left out (one thing
    to read at a time); the numeral and PERCENT CHARGED are the app's.
  - One shake impulse per 110ms jolt (the haptic cadence), not one per 60ms sensor update; hidden
    balls leave the collision pass (in the app they keep colliding while invisible).
  - Serif is Playfair Display (Brand Book), not the app's Cormorant; the playfield is inset to the
    Instagram safe area (x 160-920, y 236-1460) and drawn as the device's edge so the jolts read.
  Laws: emerald ground; Angry burnt orange (+ the game's deep red on balls) is the only state colour,
  on the balls and the one-frame glyph flash; the dot pure white; teal unused; hook text on screen at
  frame 0; wordmark only at the end.

  COPY LIST: 6:12 · PM · still replaying it. · forget it (x4) · 100 · PERCENT CHARGED ·
  Shake it out instead. · SHAKE YOUR DEVICE TO DRAIN THE CHARGE · regulate. · Somewhere to put it. ·
  4 TOOLS FREE ON THE APP STORE
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=block" rel="stylesheet">
<link rel="stylesheet" href="lib/reel.css">
<style>
  #cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 848px}
  #still{position:absolute;left:0;top:0;width:1080px;height:1920px}
  #g2{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
  #clock{display:flex;align-items:baseline;font-family:var(--serif);font-weight:500;font-size:300px;line-height:1;color:var(--cream);font-variant-numeric:lining-nums;letter-spacing:-.02em;transform-origin:50% 60%}
  #clock .colon{display:inline-block}
  #clock .d,#clock .ampm{display:inline-block}
  #clock .ampm{font-family:var(--mono);font-size:40px;letter-spacing:.3em;margin-left:22px;color:var(--sage)}
  .ln{font-family:var(--sans);font-weight:500;color:var(--cream);white-space:pre;line-height:1;letter-spacing:-.01em;transform-origin:50% 55%}
  .ln .c{display:inline-block;will-change:transform,opacity,filter}
  .hud{font-family:var(--mono);font-weight:500;font-size:22px;letter-spacing:.26em;text-transform:uppercase;color:var(--sage);white-space:nowrap;line-height:1}
  #num{font-family:var(--serif);font-weight:500;font-size:200px;line-height:1;color:var(--cream);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
</style>
<body>
<div id="wrap"><div id="stage">
<div id="cam">
  <svg id="g" viewBox="0 0 1080 1920"></svg>
  <div class="t ln" id="l0"></div><div class="t ln" id="l1"></div><div class="t ln" id="l2"></div><div class="t ln" id="l3"></div>
  <div class="t" id="num">100</div>
  <div class="t hud" id="lab">Percent charged</div>
</div>
<div id="still">
  <div class="t" id="clock"><span class="d" id="dA">6</span><span class="colon" id="colon"></span><span class="d" id="dB">12</span><span class="ampm" id="ampm">PM</span></div>
  <div class="t head italic" id="moment" style="font-size:96px;white-space:nowrap">still replaying it.</div>
  <div class="t head italic" id="ins" style="font-size:60px;white-space:nowrap">Shake it out instead.</div>
  <div class="t mono" id="insm" style="font-size:22px;letter-spacing:.2em;color:var(--cream);opacity:.85">Shake your device to drain the charge</div>
  <svg id="g2" viewBox="0 0 1080 1920"><defs><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="9"/></filter></defs></svg>
</div>
  <div id="wm"></div>
  <div class="t head italic" id="line" style="font-size:56px;white-space:nowrap;opacity:.9">Somewhere to put it.</div>
  <div class="t cta" id="cta">4 tools free on the App Store</div>
</div></div>
<div id="bar"><button id="play">Play</button><span id="tc">0.00s</span><input id="scrub" type="range" min="0" step="1" value="0"><span>regulate &middot; loud &middot; 1080&times;1920 &middot; 60fps</span></div>
<audio id="snd" preload="auto"></audio>
<script src="lib/timing-kit.js"></script>
<script src="regulate-angry-loud.timing.js"></script>
<script src="lib/reel-kit.js"></script>
<script>
const { E, clamp, lerp, P, smooth, kf, hash, $, S, A, place, riseV, rise, splitWords, headline, path, wordmark } = Reel;
const T = TIMING, F = T.field, C = { cream: '#F2F0E9', ang: '#C06C4D', deep: '#B54B32', white: '#FFFFFF' };
const NUM_T = 300, LAB_Y = 542, PT = [540, 282];        // the charge's face; the point sits above it
const INS_Y = 1250, INSM_Y = 1352;

// the device jolts once per 110ms shake stroke: a snap out, a quick settle
function jolt(t) {
  let dx = 0, dy = 0, rot = 0;
  for (const J of T.jolts) {
    const k = t - J.t; if (k < 0 || k > 200) continue;
    const env = k < 22 ? E.SNAP(k / 22) : Math.exp(-(k - 22) / 38);
    const a = (hash(J.t * 7 + 3) + 1) * Math.PI, amp = J.k === 0 ? 26 : 16;
    dx += Math.cos(a) * amp * env; dy += Math.sin(a) * amp * env * 0.8; rot += hash(J.t * 13 + 5) * 1.1 * env;
  }
  return [dx, dy, rot];
}
const lastBeat = (t) => { let b = -1e9; for (const x of T.beats) { if (x <= t) b = x; else break; } return b; };

// in-cam layer: the device's edge, balls
const EDGE_LEN = 2 * (F.x1 - F.x0 + F.y1 - F.y0);
const edge = S('rect', { x: F.x0, y: F.y0, width: F.x1 - F.x0, height: F.y1 - F.y0, rx: 64, fill: 'none', stroke: C.cream, 'stroke-width': 3, pathLength: 1000, 'stroke-dasharray': '1000 1000' });
const ballEls = T.balls.map((b) => S('line', { stroke: b.col ? C.deep : C.ang, 'stroke-width': b.r * 2, 'stroke-linecap': 'round' }));
// still layer: the colon and the point
const g2 = $('g2');
const dotUp = S('circle', { fill: C.cream }, g2), dotLo = S('circle', { fill: C.cream }, g2);
const smear = S('path', { fill: 'none', stroke: C.white, 'stroke-linecap': 'round' }, g2);
const glow = S('circle', { fill: C.white, filter: 'url(#glow)' }, g2);
const pt = S('circle', { fill: C.white }, g2);

let WM, R = 11, W_M, W_INS, W_LINE, LC = [], colonUp, colonLo, rC, clockBox;
function init() {
  WM = wordmark($('wm'), { dotPx: 22, yDot: 960 }); R = WM.R;
  W_M = splitWords($('moment')); W_INS = splitWords($('ins')); W_LINE = splitWords($('line'));
  T.lines.forEach((L, i) => {
    const el = $('l' + i); el.style.fontSize = L.size + 'px'; el.innerHTML = '';
    LC[i] = [...T.text].map((ch) => { const s = document.createElement('span'); s.className = 'c'; s.textContent = ch; el.appendChild(s); return s; }).filter((s) => s.textContent !== ' ');
  });
  window.__measure = () => T.lines.map((L, i) => [$('l' + i).offsetWidth, LC[i].map((s) => [s.textContent, +(s.offsetLeft + s.offsetWidth / 2).toFixed(1), +s.offsetWidth.toFixed(1)])]);
  const cv = document.createElement('canvas').getContext('2d'); cv.font = '500 300px "Playfair Display"';
  const cm = cv.measureText(':'), pm = cv.measureText('.'), fm = cv.measureText('1');
  $('colon').style.width = cm.width + 'px';
  const c = $('clock'); c.style.transform = 'translate(0,0)';
  const k = $('stage').getBoundingClientRect().width / 1080, cb = c.getBoundingClientRect(), cr = $('colon').getBoundingClientRect();
  clockBox = { x: 540 - cb.width / k / 2, y: 236 };
  const base = clockBox.y + (300 - (fm.fontBoundingBoxAscent + fm.fontBoundingBoxDescent)) / 2 + fm.fontBoundingBoxAscent;
  rC = (pm.actualBoundingBoxAscent + pm.actualBoundingBoxDescent) / 2;
  const cx = clockBox.x + (cr.left - cb.left) / k + (cm.actualBoundingBoxRight - cm.actualBoundingBoxLeft) / 2;
  colonLo = [cx, base + pm.actualBoundingBoxDescent - rC]; colonUp = [cx, base - cm.actualBoundingBoxAscent + rC];
}

// the point: the colon's lower dot; lifts above the numeral as the clock blows out; still through
// the shaking; then it falls into the full stop
const LIFT = [T.clockOut + 20, T.clockOut + 640];
const FALL = Reel.cubicBezier(0.55, 0, 0.6, 1), DRIFT = Reel.cubicBezier(0.25, 0.4, 0.3, 1);   // slides off its perch, then drops
function pointAt(t) {
  if (t < LIFT[0]) return colonLo;
  if (t < T.fall[0]) { const u = E.INOUT(P(t, LIFT[0], LIFT[1] - LIFT[0])); return [lerp(colonLo[0], PT[0], u), lerp(colonLo[1], PT[1], u)]; }
  const u = P(t, T.fall[0], T.fall[1] - T.fall[0]);
  return [lerp(PT[0], WM.xF, DRIFT(u)), lerp(PT[1], WM.yF, FALL(u))];
}

function render(t) {
  const [jx, jy, jr] = jolt(t);
  $('cam').style.transform = `translate(${jx.toFixed(2)}px,${jy.toFixed(2)}px) rotate(${jr.toFixed(3)}deg)`;
  const beat = t - lastBeat(t), live = t < T.clockOut;

  // the clock (the hook): pulses and blinks on the heartbeat; on the fourth replay it blows out
  const out = E.HOUSE(P(t, T.clockOut, 360)), pulse = live ? 1 + 0.014 * Math.exp(-beat / 140) : 1;
  const c = $('clock'); c.style.visibility = out < 0.999 ? 'visible' : 'hidden'; c.style.opacity = 1;
  c.style.transform = `translate(${clockBox.x}px,${clockBox.y}px) scale(${pulse})`;
  for (const id of ['dA', 'dB', 'ampm']) { const e = $(id); e.style.opacity = (1 - out).toFixed(3); e.style.filter = out > 0.01 ? `blur(${(14 * out).toFixed(2)}px)` : 'none'; e.style.transform = `scale(${1 + 0.12 * out})`; }
  const blink = live ? 0.4 + 0.6 * Math.exp(-beat / 260) : 1;
  A(dotUp, { cx: colonUp[0], cy: colonUp[1], r: rC * (1 + 0.3 * out), 'fill-opacity': blink * (1 - out) });
  const toPoint = smooth(P(t, T.clockOut, 250));
  A(dotLo, { cx: colonLo[0], cy: colonLo[1], r: rC, 'fill-opacity': t < T.clockOut + 250 ? blink * (1 - toPoint) : 0 });
  headline($('moment'), W_M, t, 540, 560, T.italic, T.italicOut, 80, { ax: 0.5 });

  // the replay: lands hard on its heartbeat (bigger, closer, sharper each time); the newest one
  // throbs with the beat; each bout's first jolt shatters one, top-down
  T.lines.forEach((L, i) => {
    const el = $('l' + i), k = t - T.lineIn[i];
    const gone = t > Math.max(...T.glyphAt[i]) + 200;
    if (k < 0 || gone) { el.style.visibility = 'hidden'; return; }
    const a = E.SNAP(P(k, 0, 200)), newest = i === 3 || t < T.lineIn[i + 1];
    const throb = newest && t < T.shake ? 0.022 * Math.exp(-beat / 130) * (t - lastBeat(t) < k ? 1 : 0) : 0;
    el.style.visibility = 'visible'; el.style.opacity = (L.o * clamp(k / 60)).toFixed(4);
    el.style.transform = `translate(${L.x}px,${L.y}px) scale(${(lerp(1.22, 1, a) + throb).toFixed(4)})`;
    el.style.filter = a < 0.995 ? `blur(${(9 * (1 - a)).toFixed(2)}px)` : 'none';
    LC[i].forEach((s, gi) => {
      const kg = t - T.glyphAt[i][gi];
      if (kg < 0) { s.style.opacity = 1; s.style.color = ''; s.style.transform = 'none'; s.style.filter = 'none'; return; }
      const flash = kg < 34, v = E.HOUSE(P(kg, 34, 150));
      s.style.color = C.ang; s.style.opacity = (flash ? 1 : 1 - v).toFixed(4);
      s.style.transform = `scale(${(flash ? 1.1 : 1.1 + 0.5 * v).toFixed(3)})`;
      s.style.filter = v > 0.01 ? `blur(${(9 * v).toFixed(2)}px)` : 'none';
    });
  });

  // the swarm: the game's balls, visible by index against the charge; drawn with a half-frame smear
  T.balls.forEach((b, i) => {
    const el = ballEls[i];
    if (!T.alive(i, t)) { el.style.visibility = 'hidden'; return; }
    const p = T.posAt(i, t), q = t - 16.67 >= b.tb ? T.posAt(i, t - 16.67) : p, bin = smooth(P(t, b.tb, 60));
    el.style.visibility = 'visible';
    A(el, { x1: lerp(p[0], q[0], 0.35), y1: lerp(p[1], q[1], 0.35), x2: p[0], y2: p[1], 'stroke-opacity': 0.85 * bin, 'stroke-width': b.r * 2 * lerp(0.4, 1, bin) });
  });

  // the charge: born at 100 in the clock's place; the device's edge draws in with the instruction
  const hOut = 1 - E.HOUSE(P(t, T.hudOut, 500)), charge = T.charge(t);
  const eIn = E.SETTLE(P(t, T.edge, 900));
  A(edge, { 'stroke-dashoffset': 1000 * (1 - eIn), 'stroke-opacity': t > T.edge ? 0.26 * hOut : 0 });
  $('num').textContent = String(Math.ceil(charge));
  rise($('num'), t, 540, NUM_T, T.clockOut + 430, T.hudOut, { ax: 0.5, dy: 30 });   // after the point has lifted clear
  rise($('lab'), t, 540, LAB_Y, T.clockOut + 600, T.hudOut, { dy: 16, blur: 6, ax: 0.5 });

  // the instruction: still while the device shakes; the app's line leaves once you're shaking
  headline($('ins'), W_INS, t, 540, INS_Y, T.instr, T.hudOut, 70, { ax: 0.5 });
  rise($('insm'), t, 540, INSM_Y, T.instrMono, T.shake + 600, { dy: 16, blur: 6, ax: 0.5, max: 0.85 });

  // the point: carries the heartbeat once the clock is gone
  const p = pointAt(t), on = t >= T.clockOut;
  const hb = on && t < T.shake ? 1 + 0.22 * Math.exp(-beat / 150) : 1;
  const sm = []; for (let k = 0; k <= 6; k++) sm.push(pointAt(Math.max(0, t - (k * 8.3) / 6)));
  A(smear, { d: path(sm), 'stroke-width': R * 2, 'stroke-opacity': t > T.fall[0] && t < T.fall[1] ? 0.55 : 0 });
  A(glow, { cx: p[0], cy: p[1], r: R * 1.9 * hb, 'fill-opacity': 0.34 * toPoint * (1 - E.HOUSE(P(t, T.fall[1], 600))) });
  A(pt, { cx: p[0], cy: p[1], r: (on ? lerp(rC, R, toPoint) : R) * hb, 'fill-opacity': toPoint });

  // close
  WM.draw(t, T.wordmark);
  headline($('line'), W_LINE, t, 540, WM.yF + 80, T.line, Infinity, 50, { ax: 0.5 });
  rise($('cta'), t, 540, WM.yF + 200, T.cta, Infinity, { dy: 18, blur: 8, ax: 0.5, max: 0.9 });
}

Reel.start({ duration: T.dur, render, init, fonts: ['500 300px "Playfair Display"', 'italic 500 96px "Playfair Display"', '500 24px "JetBrains Mono"', '500 56px Inter'] });
</script>
</body>
</html>
