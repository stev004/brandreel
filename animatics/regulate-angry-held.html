<!--
  brandreel animatic v2 - regulate - "Held." social reel (Angry -> Chaos Release), ~17s (T.dur), 1080x1920 @ 60
  Direction 3 of marketing/reels-2026-09/ANGRY_AND_TRAILER_DIRECTIONS.md (Steven 2026-09-28: see all
  three Angry directions). One of a family of three (reply / loud / held) that share one FAMILY BLOCK
  (timing, picture and score): the same phone, header, HUD, swarm physics, instruction beat,
  white-point rules, close and sound palette. One unbroken take.
  - Hook: 6:12 PM / jaw tight. saying nothing. on screen from frame 0, the colon blinking on the heartbeat.
  - Held: the digits rise away; the colon's lower dot stays in the header, the white point. The
    argument arrives on heartbeats (fine. / you always do this / forget it) where the phone's glass
    will be, then is held in: the three lines are pressed into one justified two-line block,
    letterspacing closing, weight rising, the block shrinking and heating toward Angry, a faint tremor
    in it and a squeeze on every heartbeat. The frame is dead still; only the point trembles. The
    charge numeral rises with the squeeze (the holding IS the charge), 100 at the tightest.
  - Instruction: "Shake it out instead." in the headline slot; the phone draws in around the block;
    SHAKE YOUR DEVICE TO DRAIN THE CHARGE (the app's line, ShakeGame.tsx:607) where the game's cue sits.
  - Shake: the phone (edge, block, numeral, swarm) jolts at the game's 110ms cooldown while the header
    holds still and the point hides. The first stroke bursts the block from the inside into the game's
    red balls; the charge drains 100 -> 0 in five bouts and the swarm thins with it. Last ball gone:
    stillness, silence. The phone leaves; the point comes back where it held on, still now, and falls
    into the full stop of "regulate."; Somewhere to put it.; 4 TOOLS FREE ON THE APP STORE.
  - The game is the app's (components/ShakeGame.tsx, app main): balls 10-18pt at .85 in #C06C4D /
    #B54B32; no gravity, wall bounces (.92-.98 + jitter), equal-mass collisions (.9), damping .999,
    speed floor bound to the charge; each shake kicks every ball at m x 260pt/s x .6-1.4, capped
    1200pt/s; visible balls = round(charge% x 80) by index; the charge drains one step per 60ms
    sensor update while shaking; milestone haptics at 75/50/25; numeral + PERCENT CHARGED centred
    above the balls as the app; the playfield starts under the 59pt top safe inset.
  DEVIATIONS (honest):
  - The charge RISING 0 -> 100 while the block is held is the reel's metaphor; in the app the charge
    starts at 100 and only drains.
  - Time: the drain is ~3.7s of shaking in five bouts; the game takes ~12-20s of real effort. Compressed ~4x.
  - The burst's birth kick is aimed outward from the block (a burst from the inside) at 1.25x force;
    in the game balls start spread over the screen. From the first stroke on, kicks are the game's
    (own random direction per ball).
  - One shake impulse per 110ms jolt (the haptic cadence), not per 60ms sensor update; hidden balls
    leave the collision pass; a released ball fades over 90ms instead of vanishing in one frame. HUD
    reduced to numeral + PERCENT CHARGED (no top bar, track or KEEP SHAKING: the instruction carries
    the ask). The phone is 390 x 834px of glass (0.99 px/pt, ~19.2:9) to fit under the header.
  - Serif is Playfair Display (Brand Book), not the app's Cormorant.
  Laws: emerald ground; Angry burnt orange (+ the game's deep red on balls) is the only state colour:
  balls, the block's heat, the app's cue line, the burst flash; the dot pure white and never on the
  playfield during play; teal unused; hook on screen at frame 0; wordmark only at the end. No em/en dashes.

  COPY LIST: 6:12 · PM · jaw tight. saying nothing. · fine. · you always do this · forget it ·
  0-100 · PERCENT CHARGED · Shake it out instead. · SHAKE YOUR DEVICE / TO DRAIN THE CHARGE ·
  regulate. · Somewhere to put it. · 4 TOOLS FREE ON THE APP STORE
-->

<script>
// ==== FAMILY BLOCK: byte-identical in regulate-angry-reply / -loud / -held .html (refine 09-28) ====
// The header (clock + headline slot), the one phone, the game's HUD and swarm, the instruction beat,
// the white point's rules and the end card. Stories live outside this block.
const { E, clamp, lerp, P, smooth, kf, hash, vnoise, $, S, A, place, riseV, rise, splitWords, headline, path, wordmark } = Reel;
const T = TIMING, FAM = T.FAM, BODY = FAM.body, SCR = FAM.screen;
const C = { cream: '#F2F0E9', sage: '#8F9E8B', ang: '#C06C4D', deep: '#B54B32', white: '#FFFFFF', ground: '#0a1812', flash: 'rgb(214,128,96)' };   // flash: a letter's one bright frame as it breaks (never white: white is the point's alone)
const PIVOT = [540, (BODY.y0 + BODY.y1) / 2];   // the shake pivots on the phone's centre
$('cam').style.transformOrigin = `${PIVOT[0]}px ${PIVOT[1]}px`;

// the phone jolts once per 110ms shake stroke (a snap out, a quick settle); the header stays dead still
function jolt(t) {
  let dx = 0, dy = 0, rot = 0;
  for (const J of T.jolts) {
    const k = t - J.t; if (k < 0 || k > 200) continue;
    const env = k < 22 ? E.SNAP(k / 22) : Math.exp(-(k - 22) / 38);
    const a = (hash(J.t * 7 + 3) + 1) * Math.PI, amp = J.k === 0 ? 20 : 13;
    dx += Math.cos(a) * amp * env; dy += Math.sin(a) * amp * env * 0.8; rot += hash(J.t * 13 + 5) * 1.1 * env;
  }
  return [dx, dy, rot];
}
const shaken = (p, [dx, dy, rot]) => { const a = (rot * Math.PI) / 180, x = p[0] - PIVOT[0], y = p[1] - PIVOT[1]; return [PIVOT[0] + dx + x * Math.cos(a) - y * Math.sin(a), PIVOT[1] + dy + x * Math.sin(a) + y * Math.cos(a)]; };
const lastBeat = (t) => { let b = -1e9; for (const x of T.beats) { if (x <= t) b = x; else break; } return b; };

// the phone: glass, the game's balls, the device edge (two halves drawn from the top centre down to the
// bottom centre), the Dynamic Island. Same element stack, sizes and draw-in in all three reels.
const half = (sg) => { const { x0, y0, x1, y1, rx } = BODY, x = sg > 0 ? x1 : x0, sw = sg > 0 ? 1 : 0;
  return `M540 ${y0}H${x - sg * rx}A${rx} ${rx} 0 0 ${sw} ${x} ${y0 + rx}V${y1 - rx}A${rx} ${rx} 0 0 ${sw} ${x - sg * rx} ${y1}H540`; };
const PH = {};
PH.glass = S('rect', { x: SCR.x0, y: SCR.y0, width: SCR.x1 - SCR.x0, height: SCR.y1 - SCR.y0, rx: SCR.rx, fill: C.cream, 'fill-opacity': 0 });
PH.balls = T.balls.map((b) => S('line', { stroke: b.col ? C.deep : C.ang, 'stroke-width': b.r * 2, 'stroke-linecap': 'round', visibility: 'hidden' }));
PH.edge = [1, -1].map((sg) => S('path', { d: half(sg), fill: 'none', stroke: C.cream, 'stroke-width': 2, pathLength: 1, 'stroke-opacity': 0 }));
PH.island = S('rect', { x: 540 - FAM.island.w / 2, y: FAM.island.top, width: FAM.island.w, height: FAM.island.h, rx: FAM.island.h / 2, fill: '#050c09', stroke: C.cream, 'stroke-width': 1.5, 'fill-opacity': 0, 'stroke-opacity': 0 });
function drawPhone(t, tIn, tOut) {
  const d = E.SETTLE(P(t, tIn, FAM.drawIn)), o = 1 - E.HOUSE(P(t, tOut, 520)), on = t >= tIn ? 1 : 0;
  PH.edge.forEach((e) => A(e, { 'stroke-dasharray': `${d.toFixed(4)} 1`, 'stroke-opacity': (0.22 * on * o).toFixed(4) }));
  A(PH.glass, { 'fill-opacity': (0.03 * E.HOUSE(P(t, tIn + 250, 650)) * o).toFixed(4) });
  const isl = E.HOUSE(P(t, tIn + 450, 450)) * o;
  A(PH.island, { 'fill-opacity': (0.9 * isl).toFixed(4), 'stroke-opacity': (0.14 * isl).toFixed(4) });
}
// the swarm: visible by index against the charge (the game's binding), drawn with a half-frame smear;
// a ball the charge lets go of fades and shrinks over 90ms instead of popping
function drawBalls(t) {
  T.balls.forEach((b, i) => {
    const el = PH.balls[i]; let o = 0, k = 1;
    if (T.alive(i, t)) o = 1;
    else if (T.gone[i] > b.tb && t >= T.gone[i] && t < T.gone[i] + 90) { const u = E.HOUSE((t - T.gone[i]) / 90); o = 1 - u; k = 1 - 0.45 * u; }
    if (o <= 0) { el.setAttribute('visibility', 'hidden'); return; }
    const p = T.posAt(i, t), q = t - 16.67 >= b.tb ? T.posAt(i, t - 16.67) : p, bin = smooth(P(t, b.tb, 60));
    el.setAttribute('visibility', 'visible');
    A(el, { x1: lerp(p[0], q[0], 0.35), y1: lerp(p[1], q[1], 0.35), x2: p[0], y2: p[1], 'stroke-opacity': (0.85 * bin * o).toFixed(4), 'stroke-width': (b.r * 2 * lerp(0.4, 1, bin) * k).toFixed(2) });
  });
}
// the game's HUD: serif numeral + PERCENT CHARGED, centred where ShakeGame.tsx centres it, above the balls
function drawHUD(t, value, tIn, tOut, kick = 0) {
  const n = $('num'); n.textContent = String(value);
  rise(n, t, 540, FAM.num.cy - FAM.num.px / 2, tIn, tOut, { ax: 0.5, dy: 30 });
  if (kick && n.style.visibility === 'visible') n.style.transform += ` scale(${(1 + kick).toFixed(4)})`;
  rise($('lab'), t, 540, FAM.lab.y, tIn + 120, tOut, { dy: 16, blur: 6, ax: 0.5, max: 0.9 });
}

// the header: the hook's clock, and one headline slot under it (the moment line, then the instruction)
let CLK = null, HEAD_Y = 0, W_I = null, W_LINE = null, WM = null, R = 11;
const G2 = $('g2');
const dotUp = S('circle', { fill: C.cream }, G2), dotLo = S('circle', { fill: C.cream }, G2);
const PT = { smear: S('path', { fill: 'none', stroke: C.white, 'stroke-linecap': 'round' }, G2), glow: S('circle', { fill: C.white, filter: 'url(#glow)' }, G2), pt: S('circle', { fill: C.white }, G2) };
function initFamily() {
  WM = wordmark($('wm'), { dotPx: 22, yDot: 960 }); R = WM.R;
  W_I = splitWords($('instr')); W_LINE = splitWords($('line'));
  $('num').style.fontSize = FAM.num.px + 'px';
  const px = FAM.clock.px, c = $('clock'), cv = document.createElement('canvas').getContext('2d');
  c.style.fontSize = px + 'px'; cv.font = `500 ${px}px "Playfair Display"`;
  const cm = cv.measureText(':'), pm = cv.measureText('.'), fm = cv.measureText('1'), d6 = cv.measureText('6');
  $('colon').style.width = cm.width + 'px'; c.style.transform = 'translate(0,0)';
  const k = $('stage').getBoundingClientRect().width / 1080, cb = c.getBoundingClientRect(), cr = $('colon').getBoundingClientRect();
  const off = (px - (fm.fontBoundingBoxAscent + fm.fontBoundingBoxDescent)) / 2 + fm.fontBoundingBoxAscent;   // box top -> baseline
  const y = FAM.clock.inkTop - off + d6.actualBoundingBoxAscent, base = y + off, rC = (pm.actualBoundingBoxAscent + pm.actualBoundingBoxDescent) / 2;
  const x = 540 - cb.width / k / 2, cx = x + (cr.left - cb.left) / k + (cm.actualBoundingBoxRight - cm.actualBoundingBoxLeft) / 2;
  CLK = { x, y, base, rC, lo: [cx, base + pm.actualBoundingBoxDescent - rC], up: [cx, base - cm.actualBoundingBoxAscent + rC] };
  // the headline's ink top sits FAM.head.gap below the clock's baseline
  cv.font = `italic 500 ${FAM.head.px}px "Playfair Display"`;
  const hm = cv.measureText('Shake it out instead.'), lh = 1.06 * FAM.head.px;
  const hoff = (lh - (hm.fontBoundingBoxAscent + hm.fontBoundingBoxDescent)) / 2 + hm.fontBoundingBoxAscent;
  HEAD_Y = base + FAM.head.gap - hoff + hm.actualBoundingBoxAscent;
  window.__layout = () => [...document.querySelectorAll('.hl')].map((el) => { const m = cv.measureText(el.textContent); return { text: el.textContent, inkTop: +(HEAD_Y + hoff - m.actualBoundingBoxAscent).toFixed(1), inkBottom: +(HEAD_Y + hoff + m.actualBoundingBoxDescent).toFixed(1), width: +m.width.toFixed(1), clearToPhone: +(BODY.y0 - HEAD_Y - hoff - m.actualBoundingBoxDescent).toFixed(1) }; }).concat([{ clockInkTop: FAM.clock.inkTop, clockBase: +base.toFixed(1), colonLo: CLK.lo.map((v) => +v.toFixed(1)), rC: +rC.toFixed(2), R }]);
}
// the clock pulses and its colon blinks on the heartbeat while live; it leaves by rising out with a
// blur. keepLow: the colon's lower dot stays behind (it becomes the white point).
function drawClock(t, liveUntil, outAt, keepLow) {
  const beat = t - lastBeat(t), live = t < liveUntil, out = E.HOUSE(P(t, outAt, 520)), c = $('clock');
  const pulse = live ? 1 + 0.012 * Math.exp(-beat / 140) : 1;
  c.style.visibility = out < 0.999 ? 'visible' : 'hidden'; c.style.opacity = 1;
  c.style.transform = `translate(${CLK.x}px,${CLK.y}px) scale(${pulse.toFixed(5)})`;
  for (const id of ['dA', 'dB', 'ampm']) { const e = $(id); e.style.opacity = (1 - out).toFixed(3); e.style.filter = out > 0.01 ? `blur(${(10 * out).toFixed(2)}px)` : 'none'; e.style.transform = `translateY(${(-28 * out).toFixed(2)}px)`; }
  const blink = live ? 0.4 + 0.6 * Math.exp(-beat / 300) : 1;
  A(dotUp, { cx: CLK.up[0], cy: CLK.up[1] - 28 * out, r: CLK.rC, 'fill-opacity': (blink * (1 - out)).toFixed(4) });
  if (keepLow) A(dotLo, { cx: CLK.lo[0], cy: CLK.lo[1], r: CLK.rC, 'fill-opacity': (blink * (1 - smooth(P(t, outAt, 250)))).toFixed(4) });
  else A(dotLo, { cx: CLK.lo[0], cy: CLK.lo[1] - 28 * out, r: CLK.rC, 'fill-opacity': (blink * (1 - out)).toFixed(4) });
}
// the instruction beat: the headline holds (outside the phone, never covered) until the close; the app's
// line sits where the game's cue sits and leaves before the swarm can reach it
function drawInstr(t) {
  headline($('instr'), W_I, t, 540, HEAD_Y, T.instr, T.hudOut, 70, { ax: 0.5 });
  rise($('cue'), t, 540, FAM.cue.y, T.instrMono, T.monoOut, { dy: 16, blur: 6, ax: 0.5, max: 0.9 });
}

// THE WHITE POINT. It exists before the game (the colon dot / the draft cursor); it hides as the game
// takes over (T.ptHide) and is never on the playfield while a ball is; it re-emerges alone after the
// last ball has gone and the phone has left (T.ptBack), then falls into the full stop of "regulate.".
const DRIFT = Reel.cubicBezier(0.25, 0.4, 0.3, 1), FALL = Reel.cubicBezier(0.55, 0, 0.6, 1);
const pointFall = (t, home) => { const u = P(t, T.fall[0], T.fall[1] - T.fall[0]); return [lerp(home[0], WM.xF, DRIFT(u)), lerp(home[1], WM.yF, FALL(u))]; };
const pointVis = (t, tIn) => (t < T.ptBack ? smooth(P(t, tIn, 300)) * (1 - E.HOUSE(P(t, T.ptHide, 220))) : E.HOUSE(P(t, T.ptBack, 450)));
function drawPoint(t, at, o, r) {
  const p = at(t), sm = []; for (let k = 0; k <= 6; k++) sm.push(at(Math.max(0, t - (k * 8.3) / 6)));
  A(PT.smear, { d: path(sm), 'stroke-width': (r * 2).toFixed(2), 'stroke-opacity': t > T.fall[0] && t < T.fall[1] ? (0.55 * o).toFixed(3) : 0 });
  A(PT.glow, { cx: p[0], cy: p[1], r: r * 1.9, 'fill-opacity': (0.32 * o * (1 - E.HOUSE(P(t, T.fall[1], 600)))).toFixed(4) });
  A(PT.pt, { cx: p[0], cy: p[1], r: r.toFixed(3), 'fill-opacity': o.toFixed(4) });
}
// the end card, identical: regulate. / Somewhere to put it. / 4 TOOLS FREE ON THE APP STORE
function drawClose(t) {
  WM.draw(t, T.wordmark);
  headline($('line'), W_LINE, t, 540, WM.yF + 80, T.line, Infinity, 50, { ax: 0.5 });
  rise($('cta'), t, 540, WM.yF + 200, T.cta, Infinity, { dy: 18, blur: 8, ax: 0.5, max: 0.9 });
}
const FAMILY_FONTS = ['500 160px "Playfair Display"', 'italic 500 58px "Playfair Display"', '500 127px "Playfair Display"', '500 20px "JetBrains Mono"'];
// ==== END FAMILY BLOCK ====

// ---- the story: the argument, held in ----
const BK = T.block, WORDS = T.lines.flat(), LINE_OF = T.lines.flatMap((l, i) => l.map(() => i));
const WCOL = [223, 229, 222], ACOL = [192, 108, 77], rgb = (a, b, u) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], u))).join(',')})`;
let W_M, WD = [];
function init() {
  initFamily();
  W_M = splitWords($('moment'));
  const blk = $('blk');
  WD = WORDS.map((w) => { const el = document.createElement('div'); el.className = 'wd'; blk.appendChild(el); const cs = [...w].map((ch) => { const s = document.createElement('span'); s.className = 'c'; s.textContent = ch; el.appendChild(s); return s; }); return { el, cs }; });
  window.__measure = () => { const at = (t) => { const L = layout(t); let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; L.pos.forEach(([x, y], j) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x + L.w[j]); y0 = Math.min(y0, y + 0.2 * L.fs); y1 = Math.max(y1, y + 0.95 * L.fs); });
    return { x0: +(BK.cx + L.kx * x0).toFixed(1), x1: +(BK.cx + L.kx * x1).toFixed(1), y0: +(BK.cy + L.ky * y0).toFixed(1), y1: +(BK.cy + L.ky * y1).toFixed(1) }; };
    return { loose: at(T.comp[0] - 1), tight: at(T.comp[1] + 1) }; };
}

// the held block: loose three lines -> one justified two-line block, tighter, heavier, smaller
function layout(t) {
  const c = T.held(t), u2 = E.INOUT(P(c, 0.25, 0.75));
  const fs = BK.fs, wt = Math.round(lerp(400, 820, c)), ls = lerp(0.05, -0.05, c);
  const w = WD.map(({ el }) => { el.style.fontSize = fs + 'px'; el.style.fontWeight = wt; el.style.letterSpacing = ls + 'em'; return el.offsetWidth - ls * fs; });
  const loose = [], gL = 0.3 * fs;   // loose: centred lines, generous word spaces
  T.lines.forEach((_, i) => { const idx = WORDS.map((_, j) => j).filter((j) => LINE_OF[j] === i); const LW = idx.reduce((s, j) => s + w[j], 0) + gL * (idx.length - 1); let x = -LW / 2; idx.forEach((j) => { loose[j] = [x, (i - 1) * BK.gap - fs / 2]; x += w[j] + gL; }); });
  const tight = [], gT = 0.2 * fs, lead = 0.9 * fs;   // tight: two lines justified to a common measure, leading .9
  const nat = T.brickLines.map((idx) => idx.reduce((s, j) => s + w[j], 0) + gT * (idx.length - 1)), Wb = Math.max(...nat);
  T.brickLines.forEach((idx, li) => { const g = (Wb - idx.reduce((s, j) => s + w[j], 0)) / (idx.length - 1); let x = -Wb / 2; idx.forEach((j) => { tight[j] = [x, (li ? lead / 2 : -lead / 2) - fs / 2]; x += w[j] + g; }); });
  // choreographed so no two words ever cross: the middle line splits vertically first, then slides;
  // the outer lines slide first, then close in on it
  const SCH = [[[0, 0.35], [0.4, 0.7]], [[0.15, 0.55], [0, 0.3]], [[0.2, 0.55], [0.55, 0.8]]];
  // the middle line's halves part a little further while they slide past each other, so descenders
  // and ascenders never touch, then settle to the block's leading
  const pos = WORDS.map((_, j) => { const [sx, sy] = SCH[LINE_OF[j]], ux = E.INOUT(P(c, sx[0], sx[1] - sx[0])), uy = E.INOUT(P(c, sy[0], sy[1] - sy[0]));
    const part = LINE_OF[j] === 1 ? Math.sign(tight[j][1] - loose[j][1]) * 0.12 * fs * Math.sin(Math.PI * P(c, 0.05, 0.6)) : 0;
    return [lerp(loose[j][0], tight[j][0], ux), lerp(loose[j][1], tight[j][1], uy) + part]; });
  const beat = t - lastBeat(t), sq = 1 - 0.028 * c * Math.exp(-beat / 130), k = lerp(1, 0.8, u2) * sq;
  return { c, fs, w, pos, kx: k * lerp(1, 0.94, u2), ky: k * lerp(1, 0.9, u2) };
}

// the point: the colon's lower dot, left in the header; it trembles while the argument is held,
// hides as the game takes over, comes back still after the stillness, and falls
function pointAt(t) {
  if (t >= T.ptBack) return pointFall(t, CLK.lo);
  const a = smooth(P(t, T.clockOut, 400)) * (0.9 + 2.6 * T.held(t));
  return [CLK.lo[0] + a * vnoise(t / 26, 3), CLK.lo[1] + a * vnoise(t / 26, 7)];
}

function render(t) {
  const [jx, jy, jr] = jolt(t);
  $('cam').style.transform = `translate(${jx.toFixed(2)}px,${jy.toFixed(2)}px) rotate(${jr.toFixed(3)}deg)`;

  // header: the digits rise away; the lower colon dot stays as the white point
  drawClock(t, T.clockOut, T.clockOut, true);
  headline($('moment'), W_M, t, 540, HEAD_Y, -1e9, T.italicOut, 60, { ax: 0.5 });
  drawInstr(t);
  drawPhone(t, T.phone, T.hudOut);

  // the held block (a faint tremor in it once it is tight; dead still again once it bursts)
  const L = layout(t), blk = $('blk');
  const tr = 2.2 * Math.pow(L.c, 1.5) * (t < T.burst ? 1 : 0);
  const bx = BK.cx + tr * vnoise(t / 22, 11), by = BK.cy + tr * vnoise(t / 22, 17);
  blk.style.transform = `translate(${bx.toFixed(2)}px,${by.toFixed(2)}px) scale(${L.kx.toFixed(4)},${L.ky.toFixed(4)})`;
  const col = rgb(WCOL, ACOL, 0.8 * smooth(P(L.c, 0.3, 0.7))), gone = t > T.burst + T.RIPPLE + 260;
  WD.forEach(({ el, cs }, j) => {
    const r = riseV(t, T.lineIn[LINE_OF[j]], Infinity, { dur: 620, dy: 30, blur: 12 });
    if (r.o <= 0.002 || gone) { el.style.visibility = 'hidden'; return; }
    el.style.visibility = 'visible'; el.style.opacity = r.o.toFixed(4); el.style.color = col;
    el.style.transform = `translate(${L.pos[j][0].toFixed(2)}px,${(L.pos[j][1] + r.dy).toFixed(2)}px)`;
    el.style.filter = r.blur > 0.05 ? `blur(${r.blur.toFixed(2)}px)` : 'none';
    cs.forEach((s) => {
      const clear = () => { s.style.opacity = 1; s.style.color = ''; s.style.transform = 'none'; s.style.filter = 'none'; };
      if (t < T.burst) return clear();
      const wx = BK.cx + L.kx * (L.pos[j][0] + s.offsetLeft + s.offsetWidth / 2), wy = BK.cy + L.ky * (L.pos[j][1] + 0.58 * L.fs);
      const k = t - T.rippleAt(wx, wy);
      if (k < 0) return clear();
      const flash = k < 34, v = E.HOUSE(P(k, 34, 150));
      s.style.color = C.flash; s.style.opacity = (flash ? 1 : 1 - v).toFixed(4);
      s.style.transform = `scale(${(flash ? 1.15 : 1.15 + 0.6 * v).toFixed(3)})`;
      s.style.filter = `blur(${(9 * v).toFixed(2)}px)`;
    });
  });

  // the charge: rises with the squeeze, drains with the shaking
  drawHUD(t, T.shown(t), T.numIn, T.hudOut);
  drawBalls(t);
  drawPoint(t, pointAt, pointVis(t, T.clockOut), lerp(CLK.rC, R, smooth(P(t, T.clockOut, 250))));

  drawClose(t);
}

Reel.start({ duration: T.dur, render, init, fonts: FAMILY_FONTS.concat(['400 52px Inter', '820 52px Inter']) });
</script>
</body>
</html>
