name: Render demo

on:
  push:
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install engine dependencies
        working-directory: engine
        run: npm ci
      - name: Typecheck
        working-directory: engine
        run: npm run typecheck
      - name: Test
        working-directory: engine
        run: npm test
      - name: Render demo
        run: node bin/compose.mjs workspace/demo
      - name: Lint render
        run: node bin/lint.mjs workspace/demo
      - name: Upload render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brandreel-demo
          path: |
            workspace/demo/render.mp4
            workspace/demo/lint-report.json
